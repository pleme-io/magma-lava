[package]
authors = ["pleme-io"]
description = "magma-lava — the façade crate magma consumes to load lava architectures (.tlisp) directly. Wraps lava-runtime + lava-prelude; surfaces one typed entry point (LavaPlanArgs → serde_json::Value) so magma plan/apply round-trips through .tlisp end-to-end. Zero shell, zero IPC, zero disk-roundtrip — the .tlisp source becomes magma-compatible terraform.json in one in-process call."
edition = "2024"
license = "MIT"
name = "magma-lava"
readme = "README.md"
repository = "https://github.com/pleme-io/magma-lava"
version = "0.2.6"

[lib]
name = "magma_lava"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-core = "0.1.7"
lava-eval = "0.1.10"
lava-schema = "0.1.7"
lava-runtime = "0.1.8"
lava-architectures = "0.1.16"
# Note: we INTENTIONALLY don't pull magma-plan here — it transits
# magma-plugin → magma-protocol → tonic-build → protoc, which makes
# Nix sandboxed image builds painful. plan_changes() does the empty-
# state diff directly off magma-config's parsed Config, which is the
# only shape we need until L8.3 wires a real state backend.
magma-config = "0.1.20"

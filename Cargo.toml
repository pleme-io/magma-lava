[package]
authors = ["pleme-io"]
description = "magma-lava — the façade crate magma consumes to load lava architectures (.tlisp) directly. Wraps lava-runtime + lava-prelude; surfaces one typed entry point (LavaPlanArgs → serde_json::Value) so magma plan/apply round-trips through .tlisp end-to-end. Zero shell, zero IPC, zero disk-roundtrip — the .tlisp source becomes magma-compatible terraform.json in one in-process call."
edition = "2024"
license = "MIT"
name = "magma-lava"
readme = "README.md"
repository = "https://github.com/pleme-io/magma-lava"
version = "0.2.1"

[lib]
name = "magma_lava"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-core = { git = "https://github.com/pleme-io/lava-core", branch = "main" }
lava-eval = { git = "https://github.com/pleme-io/lava-eval", branch = "main" }
lava-schema = { git = "https://github.com/pleme-io/lava-schema", branch = "main" }
lava-runtime = { git = "https://github.com/pleme-io/lava-runtime", branch = "main" }
lava-architectures = { git = "https://github.com/pleme-io/lava-architectures", branch = "main" }
magma = { git = "https://github.com/pleme-io/magma", branch = "main" }
uuid = { version = "1", features = ["v4"] }
